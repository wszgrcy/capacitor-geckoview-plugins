name: Publish NPM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  PUBLISH_TAG: latest

jobs:
  deploy-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: init
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@gmail.com"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
      - name: install-pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11'
      - run: pnpm install
      - name: Version & Publish
        run: |
          pnpm run build
          pnpm run publish
