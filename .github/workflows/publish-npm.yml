name: Publish NPM 

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  deploy-npm-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm
          cache-dependency-path: '**/package.json'
      - run: |
          npm install
      - id: publish
        name: publish
        uses: JS-DevTools/npm-publish@v4
        with:
          package: ./camera/dist/package.json
          provenance: true
          access: public
      - uses: JS-DevTools/npm-publish@v4
        with:
          package: ./preferences/dist/package.json
          provenance: true
          access: public
      - if: steps.publish.outputs.old-version != steps.publish.outputs.version
        run: |
          echo "[${{ steps.publish.outputs.type }}]Version changed: ${{ steps.publish.outputs.old-version }} => ${{ steps.publish.outputs.version }}"
          git tag v${{steps.publish.outputs.version}}
          git push origin v${{steps.publish.outputs.version}}
